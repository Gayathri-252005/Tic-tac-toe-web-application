<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tic Tac Toe - ProDigy Infotech</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Tic Tac Toe</h1>
    <p class="subtitle">ProDigy Infotech - Task 03</p>

    <div class="mode-select">
      <button id="pvpBtn" class="mode-btn active">Player vs Player</button>
      <button id="aiBtn" class="mode-btn">Play vs AI</button>
    </div>
    
    <div class="status" id="status">Player X's Turn</div>

    <div class="board" id="board">
      <div class="cell" data-cell-index="0"></div>
      <div class="cell" data-cell-index="1"></div>
      <div class="cell" data-cell-index="2"></div>
      <div class="cell" data-cell-index="3"></div>
      <div class="cell" data-cell-index="4"></div>
      <div class="cell" data-cell-index="5"></div>
      <div class="cell" data-cell-index="6"></div>
      <div class="cell" data-cell-index="7"></div>
      <div class="cell" data-cell-index="8"></div>
    </div>

    <button id="restartBtn" class="btn">Restart Game</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
